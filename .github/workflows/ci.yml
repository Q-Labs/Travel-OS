name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # @q-labs/cobalt lives on GitHub Packages
          registry-url: https://npm.pkg.github.com
          scope: '@q-labs'
      - run: npm ci
        env:
          # COBALT_PACKAGES_TOKEN: a token with read:packages. The built-in
          # GITHUB_TOKEN cannot read a package owned by another account.
          NODE_AUTH_TOKEN: ${{ secrets.COBALT_PACKAGES_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  playwright:
    # Playwright 1.56 does not support the Ubuntu 26.04 that ubuntu-latest now
    # resolves to ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # @q-labs/cobalt lives on GitHub Packages
          registry-url: https://npm.pkg.github.com
          scope: '@q-labs'
      - run: npm ci
        env:
          # COBALT_PACKAGES_TOKEN: a token with read:packages. The built-in
          # GITHUB_TOKEN cannot read a package owned by another account.
          NODE_AUTH_TOKEN: ${{ secrets.COBALT_PACKAGES_TOKEN }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: playwright-report/
      - uses: actions/upload-artifact@v4
        if: always() && github.ref != 'refs/heads/main'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7

  deploy-playwright-report:
    runs-on: ubuntu-latest
    needs: playwright
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
